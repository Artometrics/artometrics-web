name: Push staging import to codex
on:
  workflow_dispatch:
  push:
    paths:
      - '_staging/codex-import/**'
      - '.github/workflows/push-codex-import.yml'
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push files to kylesmcauliffe/codex
        env:
          CODE_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODE_GITHUB_TOKEN:-}" ]; then
            echo "CODEX_GITHUB_TOKEN secret not set; skipping"
            exit 0
          fi
          git clone "https://x-access-token:${CODE_GITHUB_TOKEN}@github.com/kylesmcauliffe/codex.git" /tmp/codex
          mkdir -p /tmp/codex/src/apps/novelcrafter/content/gatsby
          cp _staging/codex-import/ch*.txt /tmp/codex/src/apps/novelcrafter/content/gatsby/
          cp _staging/codex-import/gatsby-chapters.ts /tmp/codex/src/apps/novelcrafter/
          cp _staging/codex-import/package-lock.json /tmp/codex/
          if [ -d _staging/codex-import/parts ]; then
            cp _staging/codex-import/parts/*.ts /tmp/codex/src/apps/novelcrafter/content/gatsby/ || true
          fi
          cd /tmp/codex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/novelcrafter/content/gatsby/ch*.txt src/apps/novelcrafter/content/gatsby/ch*.p*.ts src/apps/novelcrafter/gatsby-chapters.ts package-lock.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Import Twilda: gatsby chapters + parts + package-lock from staging"
          git push
